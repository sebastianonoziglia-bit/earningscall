name: Sync Google Sheet to Supabase

# Runs the sync script on a schedule so the user only ever has to edit
# the Google Sheet — everything else flows automatically into Supabase.
#
# Schedule: every hour, on the hour. Free tier of GitHub Actions has a
# 5-minute minimum cron, but in practice ~1h is the right cadence for
# the slow-moving data (financial metrics, holders, daily/yearly stocks).
# Live ticker prices are fetched from Yahoo directly in the Streamlit app
# with a 60-second cache, so they don't need this sync.

on:
  schedule:
    - cron: "0 * * * *"   # every hour at :00
  workflow_dispatch:        # allow manual run from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests openpyxl

      - name: Run sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/sync_gsheet_to_supabase.py
